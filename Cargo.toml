[package]
name = "shorter"
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["James Hodgkinson <james+shorter@terminaloutcomes.com>"]
description = "Yet another link shortener written in Rust"
readme = "README.md"
repository = "https://github.com/yaleman/shorter"


[dependencies]
axum = { version = "0.8.9", features = ["macros", "http2"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }

# Database - sea-orm
sea-orm = { version = "2.0", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "2.0" }


# Authentication
openidconnect = "4.0"
chrono = { version = "0.4", features = ["serde"] }
http = "1.4.1"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "h2",
    "rustls-tls-webpki-roots",
] }
time = "0.3.47"

tokio = { version = "1.52.3", features = ["full", "tracing"] }
tracing-subscriber = "0.3.23"
url = { version = "2.5.9", features = ["serde"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }

axum-csp = "0.0.10"

askama = { version = "0.16.0" }

tracing = { version = "^0.1.44", features = ["release_max_level_debug"] }
tower-http = { version = "^0.7.0", features = [
    "fs",
    "trace",
    "add-extension",
    "compression-gzip",
] }
tower-sessions = { version = "^0.15.0", features = ["axum-core"] }
async-trait = "0.1.89"
tower-sessions-sqlx-store = { version = "0.16.0", features = ["sqlite"] }
sqlx = { version = "0.9.1", features = [
    "runtime-tokio",
    "sqlite",
    "tls-rustls",
] }
axum-server = { version = "0.9.0", features = ["tls-rustls"] }
rustls = { version = "0.23.40", features = [
    "brotli",
    "hashbrown",
    "zlib",
    "aws-lc-rs",
] }


[dev-dependencies]
hyper = "1.10.1"
serde_json = "1.0.150"
tower = "0.5.3"


[profile.release]
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
lto = "fat"
incremental = false
